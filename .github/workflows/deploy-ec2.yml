name: Deploy ETL Validation to EC2

on:
  workflow_run:
    workflows:
      - Docker Build and Push to GHCR
    branches:
      - devops-upgrade
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy and Run ETL Tests on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-055d0f01b48348a40 \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions ETL deployment" \
            --parameters 'commands=["docker pull ghcr.io/boobesh1503/sales-etl-validation:latest","docker run --rm ghcr.io/boobesh1503/sales-etl-validation:latest"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-055d0f01b48348a40 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-055d0f01b48348a40 \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-055d0f01b48348a40 \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1
